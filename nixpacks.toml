[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.0.0 --activate",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = ["cd artifacts/api-server && pnpm run build"]

[start]
cmd = "cd artifacts/api-server && node --enable-source-maps ./dist/index.mjs"
